apiVersion: v1
kind: Service
metadata:
  name: asterisk
  namespace: asterisk
spec:
  type: ClusterIP
  selector:
    app: asterisk
  ports:
    - name: sip-udp
      port: 5060
      targetPort: 5060
      protocol: UDP
    - name: sip-tcp
      port: 5060
      targetPort: 5060
      protocol: TCP
    - name: ami
      port: 5038
      targetPort: 5038
      protocol: TCP