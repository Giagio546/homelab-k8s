apiVersion: apps/v1
kind: Deployment
metadata:
  name: asterisk
  namespace: asterisk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: asterisk
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: asterisk
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: asterisk
          image: andrius/asterisk:20
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: Europe/Rome
            - name: SIP_100_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: asterisk-sip
                  key: sip-100-password
            - name: SIP_200_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: asterisk-sip
                  key: sip-200-password
            - name: SIP_300_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: asterisk-sip
                  key: sip-300-password
            - name: AMI_SECRET
              valueFrom:
                secretKeyRef:
                  name: asterisk-sip
                  key: ami-secret
            - name: ARI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: asterisk-sip
                  key: ari-password
          ports:
            - name: sip-udp
              containerPort: 5060
              protocol: UDP
            - name: sip-tcp
              containerPort: 5060
              protocol: TCP
            - name: ami
              containerPort: 5038
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /config-src
              readOnly: true
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              cp /config-src/extensions.conf /etc/asterisk/extensions.conf
              cp /config-src/confbridge.conf /etc/asterisk/confbridge.conf
              cp /config-src/rtp.conf /etc/asterisk/rtp.conf
              cp /config-src/http.conf /etc/asterisk/http.conf
              sed -e "s|__SIP_100_PASSWORD__|${SIP_100_PASSWORD}|g" \
                  -e "s|__SIP_200_PASSWORD__|${SIP_200_PASSWORD}|g" \
                  -e "s|__SIP_300_PASSWORD__|${SIP_300_PASSWORD}|g" \
                  /config-src/pjsip.conf.template > /etc/asterisk/pjsip.conf
              sed -e "s|__AMI_SECRET__|${AMI_SECRET}|g" /config-src/manager.conf > /etc/asterisk/manager.conf
              sed -e "s|__ARI_PASSWORD__|${ARI_PASSWORD}|g" /config-src/ari.conf > /etc/asterisk/ari.conf
              test -f /etc/asterisk/modules.conf || printf '%s\n' '[modules]' 'autoload=yes' > /etc/asterisk/modules.conf
              exec asterisk -f -vvv
          readinessProbe:
            exec:
              command: ["asterisk", "-rx", "core show version"]
            initialDelaySeconds: 25
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi

        - name: citofono-ring
          image: python:3.12-bookworm
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: Europe/Rome
            - name: AMI_HOST
              value: "127.0.0.1"
            - name: AMI_PORT
              value: "5038"
            - name: AMI_USER
              value: ha
            - name: AMI_SECRET
              valueFrom:
                secretKeyRef:
                  name: asterisk-sip
                  key: ami-secret
            - name: RING_HTTP_HOST
              value: "0.0.0.0"
            - name: RING_HTTP_PORT
              value: "8099"
            - name: SIP_PHONE
              value: PJSIP/100
            - name: SIP_CAMERA
              value: PJSIP/300
          ports:
            - name: ring-http
              containerPort: 8099
              protocol: TCP
          volumeMounts:
            - name: ring-app
              mountPath: /app
              readOnly: true
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              exec python3 -u /app/citofono_ring.py
          readinessProbe:
            httpGet:
              host: 127.0.0.1
              path: /health
              port: 8099
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi

        - name: citofono-baresip
          image: debian:bookworm-slim
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: Europe/Rome
            - name: SIP_300_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: asterisk-sip
                  key: sip-300-password
          volumeMounts:
            - name: baresip
              mountPath: /baresip-src
              readOnly: true
            - name: baresip-home
              mountPath: /root/.baresip
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends baresip ffmpeg ca-certificates >/dev/null
              mkdir -p /root/.baresip
              sed "s|__SIP_300_PASSWORD__|${SIP_300_PASSWORD}|g" /baresip-src/accounts > /root/.baresip/accounts
              cp /baresip-src/config /root/.baresip/config
              # Debian baresip module path may differ
              if [ -d /usr/lib/baresip/modules ]; then
                sed -i 's|/usr/local/lib/baresip/modules|/usr/lib/baresip/modules|' /root/.baresip/config
              fi
              exec baresip -f /root/.baresip -v
          readinessProbe:
            exec:
              command: ["bash", "-c", "pgrep -x baresip >/dev/null"]
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi

      volumes:
        - name: config
          projected:
            sources:
              - configMap:
                  name: asterisk-config
              - secret:
                  name: asterisk-sip
                  items:
                    - key: pjsip.conf.template
                      path: pjsip.conf.template
        - name: ring-app
          configMap:
            name: citofono-ring-app
            defaultMode: 420
        - name: baresip
          configMap:
            name: citofono-baresip
            defaultMode: 420
        - name: baresip-home
          emptyDir: {}
