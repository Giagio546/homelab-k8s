apiVersion: v1
kind: ConfigMap
metadata:
  name: asterisk-config
  namespace: asterisk
data:
  extensions.conf: |
    [general]
    static=yes
    writeprotect=no
    
    [from-internal]
    exten => 100,1,NoOp(Dial Filippo Linphone)
     same => n,Dial(PJSIP/100,60)
     same => n,Hangup()
    
    exten => 200,1,NoOp(Citofono self)
     same => n,Dial(PJSIP/200,30)
     same => n,Hangup()
    
    exten => 201,1,NoOp(Test ring Filippo)
     same => n,Dial(PJSIP/100,60)
     same => n,Hangup()
    
    exten => 300,1,NoOp(Camera UA)
     same => n,Hangup()

    [citofono-b]
    ; Mute TX from camera UA (baresip ausine was a continuous 440 Hz tone).
    exten => s,1,NoOp(Mute camera audio TX)
     same => n,Set(VOLUME(TX)=0)
     same => n,Return()
  confbridge.conf: |
    [general]
    
    [citofono_bridge]
    type=bridge
    max_members=4
    mixing_interval=10
    video_mode=sfu
    remb_send_interval=1000
    enable_events=yes
    
    [citofono_user]
    type=user
    quiet=yes
    music_on_hold_when_empty=no
    announce_user_count=no
    dsp_drop_silence=no
    
    [citofono_cam]
    type=user
    quiet=yes
    music_on_hold_when_empty=no
    announce_user_count=no
    marked=yes
    startmuted=yes
  rtp.conf: |
    [general]
    rtpstart=10000
    rtpend=10200
    strictrtp=no
  http.conf: |
    [general]
    enabled=yes
    bindaddr=127.0.0.1
    bindport=8088
  ari.conf: |
    [general]
    enabled=yes
    pretty=yes
    [citofono]
    type=user
    read_only=no
    password=__ARI_PASSWORD__
  manager.conf: |
    [general]
    enabled=yes
    webenabled=no
    port=5038
    bindaddr=0.0.0.0
    [ha]
    secret=__AMI_SECRET__
    deny=0.0.0.0/0.0.0.0
    permit=127.0.0.1/255.255.255.255
    permit=192.168.8.0/255.255.255.0
    permit=10.42.0.0/255.255.0.0
    permit=100.64.0.0/255.192.0.0
    read=system,call,log,verbose,agent,user,config,dtmf,reporting,cdr,originate
    write=system,call,agent,user,config,originate
