apiVersion: v1
kind: ConfigMap
metadata:
  name: asterisk-config
  namespace: asterisk
data:
  extensions.conf: |
    [general]
    static=yes
    writeprotect=no

    [from-internal]
    ; Linphone / softphones
    exten => 100,1,NoOp(Dial Filippo Linphone)
     same => n,Dial(PJSIP/100,60)
     same => n,Hangup()

    ; Citofono caller endpoint (used by AMI Originate later)
    exten => 200,1,NoOp(Citofono self)
     same => n,Dial(PJSIP/200,30)
     same => n,Hangup()

    ; Convenience: dial citofono from phone for tests
    exten => 201,1,NoOp(Test ring Filippo as if citofono)
     same => n,Dial(PJSIP/100,60)
     same => n,Hangup()

    ; Fallback: AMI Originate Application Stasis / Local into video app
    [citofono-stasis]
    exten => s,1,NoOp(Citofono video Stasis)
     same => n,Stasis(citofono)
     same => n,Hangup()

    exten => ring,1,NoOp(Citofono Local ring into Stasis)
     same => n,Answer()
     same => n,Stasis(citofono,ring)
     same => n,Hangup()

  rtp.conf: |
    [general]
    rtpstart=10000
    rtpend=10200
    strictrtp=no
    icesupport=no

  http.conf: |
    [general]
    enabled=yes
    bindaddr=127.0.0.1
    bindport=8088

  ari.conf: |
    [general]
    enabled=yes
    pretty=yes
    allowed_origins=*

    [citofono]
    type=user
    read_only=no
    password=__ARI_PASSWORD__

  manager.conf: |
    [general]
    enabled=yes
    webenabled=no
    port=5038
    bindaddr=0.0.0.0

    [ha]
    secret=__AMI_SECRET__
    deny=0.0.0.0/0.0.0.0
    permit=192.168.8.0/255.255.255.0
    permit=10.42.0.0/255.255.0.0
    permit=100.64.0.0/255.192.0.0
    read=system,call,log,verbose,agent,user,config,dtmf,reporting,cdr,originate
    write=system,call,agent,user,config,originate
