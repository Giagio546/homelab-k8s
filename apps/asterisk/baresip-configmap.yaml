apiVersion: v1
kind: ConfigMap
metadata:
  name: citofono-baresip
  namespace: asterisk
data:
  config: |
    poll_method		epoll
    sip_listen		0.0.0.0:5062
    module_path		/usr/lib/x86_64-linux-gnu/baresip/modules
    module			g711.so
    module			auconv.so
    module			auresamp.so
    module			ausine.so
    module			aufile.so
    module			fakevideo.so
    module			account.so
    module			contact.so
    module			menu.so
    module			uuid.so
    module			stun.so
    module			turn.so
    module			ice.so
    # Temporary: official image has no avformat/avcodec. Swap to avformat RTSP
    # when using the custom baresip-ffmpeg image (see Dockerfile.baresip).
    audio_player		aufile
    audio_source		ausine
    video_source		fakevideo
    video_display		fakevideo
    video_size		1280x720
    video_bitrate		800000
    video_fps		15
    sip_verify_server	no
  accounts: |
    <sip:300@192.168.8.132>;auth_user=300;auth_pass=__SIP_300_PASSWORD__;outbound=sip:192.168.8.132:5060;regint=60;answermode=auto;video_codecs=H264/90000