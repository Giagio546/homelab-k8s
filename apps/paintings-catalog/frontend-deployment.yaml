apiVersion: apps/v1
kind: Deployment
metadata:
  name: paintings-catalog-frontend
  namespace: paintings-catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paintings-catalog-frontend
  template:
    metadata:
      labels:
        app: paintings-catalog-frontend
        app.kubernetes.io/name: paintings-catalog-frontend
    spec:
      nodeSelector:
        node-type: vps
      tolerations:
        - key: dedicated
          operator: Equal
          value: vps
          effect: NoSchedule

      containers:
        - name: frontend
          image: ghcr.io/giagio546/paintings-catalog-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80

          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 6

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi

      volumes:
        - name: nginx-config
          configMap:
            name: paintings-catalog-frontend-nginx
