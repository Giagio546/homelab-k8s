apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: paintings-catalog
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Giagio546/homelab-k8s.git
    targetRevision: main
    path: apps/paintings-catalog
  destination:
    server: https://kubernetes.default.svc
    namespace: paintings-catalog
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
