apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: asterisk
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Giagio546/homelab-k8s
    targetRevision: main
    path: apps/asterisk
  destination:
    server: https://kubernetes.default.svc
    namespace: asterisk
  syncPolicy:
    automated:
      prune: true
      selfHeal: true